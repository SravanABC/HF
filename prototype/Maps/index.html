<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Exit Ahead - Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div id="map" style="height: 500px;"></div>
    <ul id="restaurant-list"></ul>
    <script>
        const map = L.map('map').setView([33.749, -84.388], 12);
        const driver = { lat: 33.75, lng: -84.39 };

        L.marker([driver.lat, driver.lng])
            .addTo(map)
            .bindPopup('You are here')
            .openPopup();

        //fetch, then handle the response (calling an external API, handling an async response, parsing nested JSON, and transforming coordinates to draw a real road path)

        function drawRoute(from, to) {
            const url = 'https://router.project-osrm.org/route/v1/driving/'
                + from.lng + ',' + from.lat + ';' + to.lng + ',' + to.lat
                + '?overview=full&geometries=geojson';

            fetch(url)
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    const coords = data.routes[0].geometry.coordinates;
                    const latlngs = coords.map(function (c) {
                        return [c[1], c[0]];
                    });
                    L.polyline(latlngs, { color: 'blue', weight: 4 }).addTo(map);
                });
        }

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const listE1 = document.getElementById('restaurant-list');

        fetch('http://127.0.0.1:8000/restaurants?lat=' + driver.lat + '&lng=' + driver.lng)
            .then(function (response) {
                return response.json();
            })
            .then(function (restaurants) {
                restaurants.forEach(function (r, index) {
                    L.marker([r.lat, r.lng])
                        .addTo(map)
                        .bindPopup('<b>' + r.name + '</b><br>' + r.offer + '<br>' + r.dist.toFixed(1) + ' mi away');

                    const li = document.createElement('li');
                    li.textContent = (index + 1) + '. ' + r.name + ' - ' + r.dist.toFixed(1) + ' mi - ' + r.offer;
                    listE1.appendChild(li);
                });

                drawRoute(driver, restaurants[0]);
            });
    </script>
</body>

</html>
