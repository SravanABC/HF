<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exit Ahead: order food on the road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F3EC;--card:#FFFFFF;--ink:#16211C;--muted:#5B6A62;--sign:#0F6B4B;--signink:#FFFFFF;--go:#F5C518;--goink:#1A1500;--line:#D5DACF;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1512;--card:#17241E;--ink:#E9EEE8;--muted:#9AABA1;--line:#2A3B33;--sign:#12805A}}
:root[data-theme="dark"]{--paper:#0E1512;--card:#17241E;--ink:#E9EEE8;--muted:#9AABA1;--line:#2A3B33;--sign:#12805A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.4 Barlow,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:12px 16px 40px}
h1,h2,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
.sign{background:var(--sign);color:var(--signink);border-radius:14px;padding:16px 18px;border:3px solid var(--signink);outline:3px solid var(--sign);margin:4px 3px 18px}
.sign h1{font-size:40px;line-height:1}
.sign p{margin:6px 0 0;font-size:17px;opacity:.92}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{min-height:52px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:600 18px Barlow,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.cta{display:block;width:100%;min-height:72px;border:0;border-radius:16px;background:var(--go);color:var(--goink);font:700 30px "Barlow Condensed",sans-serif;cursor:pointer;margin:0 0 10px}
.cta.alt{background:transparent;color:var(--ink);border:2px solid var(--line);min-height:56px;font-size:22px}
.cta[disabled]{opacity:.45}
.mic{display:flex;align-items:center;justify-content:center;gap:12px}
.mic i{width:14px;height:14px;border-radius:50%;background:var(--bad)}
.stop{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.stop h2{font-size:30px;line-height:1.05}
.meta{color:var(--muted);margin:4px 0 12px;font-size:16px}
.tag{display:inline-block;background:var(--sign);color:var(--signink);border-radius:6px;padding:1px 8px;font-weight:600;font-size:15px;margin-right:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:26px;cursor:pointer}
.total{font:700 34px "Barlow Condensed",sans-serif;display:flex;justify-content:space-between;padding:14px 0}
.note{background:var(--card);border-left:6px solid var(--go);padding:12px 14px;border-radius:8px;margin:0 0 14px;font-size:16px}
.heard{font-size:16px;color:var(--muted);margin:0 0 12px}
.back{background:none;border:0;color:var(--ink);font:600 18px Barlow,sans-serif;min-height:48px;padding:0;cursor:pointer;margin-bottom:6px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
var STOPS=[
{id:'sb',name:'Sunrise Biscuit Co.',exit:'Exit 247',off:2,eta:5,usual:{sb1:1,sb3:1},menu:[{id:'sb1',n:'Sausage biscuit',p:4.25,k:['sausage','biscuit']},{id:'sb2',n:'Chicken biscuit',p:5.25,k:['chicken']},{id:'sb3',n:'Hash browns',p:2.5,k:['hash']},{id:'sb4',n:'Cold brew',p:3.75,k:['brew','coffee']}]},
{id:'pp',name:'Peach Pit Burgers',exit:'Exit 249',off:4,eta:9,usual:{pp1:1,pp3:1},menu:[{id:'pp1',n:'Double cheeseburger',p:8.99,k:['cheeseburger','burger']},{id:'pp2',n:'Chicken sandwich',p:7.99,k:['chicken','sandwich']},{id:'pp3',n:'Fries',p:3.49,k:['fries']},{id:'pp4',n:'Sweet tea',p:2.49,k:['tea']}]},
{id:'sc',name:'Saigon Corner',exit:'Exit 251',off:6,eta:14,usual:{sc1:1,sc3:1},menu:[{id:'sc1',n:'Banh mi',p:9.5,k:['banh','mi']},{id:'sc2',n:'Spring rolls',p:5.5,k:['spring','rolls']},{id:'sc3',n:'Iced coffee',p:4.25,k:['iced']}]}
];
var S={moving:true,view:'home',stop:null,cart:{},heard:'',order:null};
var app=document.getElementById('app');
function stop(id){return STOPS.filter(function(s){return s.id===id})[0]}
function money(n){return '$'+n.toFixed(2)}
function clock(m){var d=new Date(Date.now()+m*60000);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function total(st,cart){return st.menu.reduce(function(t,i){return t+(cart[i.id]||0)*i.p},0)}
function lines(st,cart){return st.menu.filter(function(i){return cart[i.id]}).map(function(i){return cart[i.id]+' × '+i.n})}
function go(v){S.view=v;render()}
function home(){
 var h='<div class="sign"><h1>Food ahead on I-85 S</h1><p>Destination in 22 min. Order now, pick up on arrival.</p></div>';
 h+='<div class="seg" role="group" aria-label="Driving state"><button aria-pressed="'+S.moving+'" data-a="moving">Driving</button><button aria-pressed="'+!S.moving+'" data-a="parked">Parked</button></div>';
 if(S.moving)h+='<p class="note">Driving mode: one-tap usuals and voice only. Full menus unlock when you park.</p>';
 h+='<button class="cta mic" data-a="voice"><i></i>Say your order</button>';
 if(S.heard)h+='<p class="heard">'+S.heard+'</p>';
 STOPS.forEach(function(s){
  h+='<section class="stop"><h2>'+s.name+'</h2><p class="meta"><span class="tag">'+s.exit+'</span>'+s.off+' min off route · ready by '+clock(s.eta)+'</p>';
  h+='<button class="cta" data-a="usual" data-id="'+s.id+'" style="font-size:26px;min-height:64px">Order usual · '+money(total(s,s.usual))+'</button>';
  if(!S.moving)h+='<button class="cta alt" data-a="menu" data-id="'+s.id+'">See menu</button>';
  h+='</section>';
 });
 return h;
}
function menu(){
 var s=stop(S.stop),h='<button class="back" data-a="home">‹ Back</button><div class="sign"><h1>'+s.name+'</h1><p>'+s.exit+' · ready by '+clock(s.eta)+'</p></div>';
 s.menu.forEach(function(i){var q=S.cart[i.id]||0;
  h+='<div class="row"><div><strong>'+i.n+'</strong><br><span class="meta">'+money(i.p)+'</span></div><div class="qty"><button data-a="dec" data-id="'+i.id+'" aria-label="Remove one '+i.n+'">−</button><b>'+q+'</b><button data-a="inc" data-id="'+i.id+'" aria-label="Add one '+i.n+'">+</button></div></div>';});
 h+='<div class="total"><span>Total</span><span>'+money(total(s,S.cart))+'</span></div><button class="cta" data-a="review"'+(total(s,S.cart)?'':' disabled')+'>Review order</button>';
 return h;
}
function confirm(){
 var s=stop(S.stop),h='<button class="back" data-a="home">‹ Cancel</button><div class="sign"><h1>Confirm order</h1><p>'+s.name+' · '+s.exit+'</p></div>';
 if(S.moving)h+='<p class="note">Read back: '+lines(s,S.cart).join(', ')+'. Tap confirm to place it.</p>';
 lines(s,S.cart).forEach(function(l){h+='<div class="row"><strong>'+l+'</strong></div>'});
 h+='<div class="total"><span>Total</span><span>'+money(total(s,S.cart))+'</span></div>';
 h+='<p class="meta">Pay with saved card. Pickup ready at '+clock(s.eta)+', about when you arrive.</p><button class="cta" data-a="place">Confirm order</button><button class="cta alt" data-a="home">Cancel</button>';
 return h;
}
function done(){
 var s=stop(S.stop);
 return '<div class="sign"><h1>Order placed</h1><p>Order '+S.order+' at '+s.name+'</p></div><p class="note">Pull up to the pickup spot at '+s.exit+'. Your food is ready at '+clock(s.eta)+'. Nothing else to do while driving.</p><button class="cta" data-a="home">Done</button>';
}
function render(){app.innerHTML=S.view==='home'?home():S.view==='menu'?menu():S.view==='confirm'?confirm():done();window.scrollTo(0,0)}
function parse(t){
 t=t.toLowerCase();var best=null,bc=null,n=-1;
 STOPS.forEach(function(s){var c={},k=0;
  s.menu.forEach(function(i){if(i.k.some(function(w){return t.indexOf(w)>-1})){c[i.id]=1;k++}});
  if(s.name.toLowerCase().split(' ').some(function(w){return w.length>3&&t.indexOf(w)>-1}))k+=2;
  if(k>n&&Object.keys(c).length){n=k;best=s.id;bc=c}});
 return best?{stop:best,cart:bc}:null;
}
function voice(){
 var demo='Double cheeseburger and fries from Peach Pit';
 function handle(t){S.heard='Heard: “'+t+'”';var r=parse(t);
  if(r){S.stop=r.stop;S.cart=r.cart;go('confirm')}else{S.heard+=' . No match. Try a menu item or a stop name.';render()}}
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){handle(demo);return}
 try{var r=new SR();r.lang='en-US';r.onresult=function(e){handle(e.results[0][0].transcript)};r.onerror=function(){handle(demo)};r.start()}catch(e){handle(demo)}
}
app.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
 if(a==='moving'){S.moving=true;S.view='home';render()}
 else if(a==='parked'){S.moving=false;render()}
 else if(a==='voice')voice();
 else if(a==='usual'){S.stop=id;S.cart=Object.assign({},stop(id).usual);go('confirm')}
 else if(a==='menu'&&!S.moving){S.stop=id;S.cart={};go('menu')}
 else if(a==='inc'){S.cart[id]=(S.cart[id]||0)+1;render()}
 else if(a==='dec'){S.cart[id]=Math.max(0,(S.cart[id]||0)-1);render()}
 else if(a==='review')go('confirm');
 else if(a==='place'){S.order='A-'+(2000+Math.floor(Math.random()*900));go('done')}
 else if(a==='home'){S.heard='';S.cart={};go('home')}
});
render();
</script>
</body>
</html>
